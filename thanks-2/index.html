    <style>
      :root {
        --ink: #171613;
        --paper: #f5f0e9;
        --blush: #efc7bd;
        --night: #393340;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: "Manrope", sans-serif;
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        z-index: -1;
        width: 44vw;
        height: 44vw;
        border-radius: 50%;
        filter: blur(1px);
      }

      body::before {
        top: -22vw;
        left: -12vw;
        background: var(--blush);
      }

      body::after {
        right: -18vw;
        bottom: -24vw;
        background: var(--night);
      }

      main {
        position: relative;
        width: min(920px, 100%);
        padding: clamp(48px, 9vw, 104px) clamp(24px, 8vw, 92px);
        overflow: hidden;
        border-radius: 220px 220px 24px 24px;
        background: var(--ink);
        color: white;
        text-align: center;
        box-shadow: 0 30px 90px rgba(23, 22, 19, 0.18);

      .eyebrow {

        letter-spacing: -.06em;

        display: block;
        font-family: "Prata", serif;
        font-style: italic;
        font-weight: 400;
      }

      a {
        display: inline-flex;
        min-height: 58px;
        align-items: center;
        justify-content: center;
        padding: 0 30px;
        border: 1px solid var(--blush);
        border-radius: 999px;
        background: var(--blush);
        color: var(--ink);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: .04em;
        text-decoration: none;
        text-transform: uppercase;
        transition: transform .25s ease, background .25s ease, color .25s ease;
      }

      a:hover {
        transform: translateY(-3px);
        background: transparent;
        color: white;
      }
